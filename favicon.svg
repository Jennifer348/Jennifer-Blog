<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#f3eeff"/>

  <!-- Stem -->
  <line x1="32" y1="58" x2="32" y2="20" stroke="#7a5f3a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left branch -->
  <line x1="32" y1="40" x2="22" y2="30" stroke="#7a5f3a" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right branch -->
  <line x1="32" y1="36" x2="42" y2="26" stroke="#7a5f3a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Main spike - blooms -->
  <ellipse cx="32" cy="18" rx="4" ry="6" fill="#9b72cf"/>
  <ellipse cx="32" cy="14" rx="3.5" ry="5" fill="#b48fe0"/>
  <ellipse cx="32" cy="10" rx="3" ry="4" fill="#c9a8f0"/>
  <ellipse cx="32" cy="7"  rx="2.5" ry="3" fill="#dbbff5"/>

  <!-- Left spike -->
  <ellipse cx="22" cy="28" rx="3.5" ry="5.5" fill="#9b72cf"/>
  <ellipse cx="22" cy="24" rx="3" ry="4.5" fill="#b48fe0"/>
  <ellipse cx="22" cy="20" rx="2.5" ry="3.5" fill="#c9a8f0"/>

  <!-- Right spike -->
  <ellipse cx="42" cy="24" rx="3.5" ry="5.5" fill="#9b72cf"/>
  <ellipse cx="42" cy="20" rx="3" ry="4.5" fill="#b48fe0"/>
  <ellipse cx="42" cy="16" rx="2.5" ry="3.5" fill="#c9a8f0"/>
</svg>
