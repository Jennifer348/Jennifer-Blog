<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Jennifer Qi</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-list {
            list-style: none;
            padding: 0;
            margin: 60px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .contact-list li {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .contact-list a {
            color: #000;
            text-decoration: none;
            font-size: 1rem;
        }
        .contact-list svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="site-name">Jennifer Qi</h1>

        <header>
            <div class="header-wrapper">
                <div class="profile-section">
                    <img src="asset/profilepic.jpeg" alt="Jennifer Qi" class="profile-image">
                    <nav>
                        <a href="index.html">About</a>
                        <a href="contact.html">Contact</a>
                        <a href="writing.html">Writing</a>
                        <a href="photography.html">Photography</a>
                        <a href="arts.html">Arts</a>
                    </nav>
                </div>
                <div class="lang-switcher">
                    <a href="contact.html" class="active">English</a>
                    <span class="lang-divider">|</span>
                    <a href="index-zh.html">中</a>
                </div>
            </div>
        </header>

        <main>
            <ul class="contact-list">
                <li>
                    <!-- Email icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <polyline points="2,4 12,13 22,4"/>
                    </svg>
                    <a href="mailto:jennifer172624@gmail.com">jennifer172624@gmail.com</a>
                </li>
                <li>
                    <!-- Instagram icon -->
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5"/>
                        <circle cx="12" cy="12" r="4"/>
                        <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
                    </svg>
                    <a href="https://www.instagram.com/jenniferz_qi" target="_blank">@jenniferz_qi</a>
                </li>
            </ul>
        </main>

        <footer>
            <p>&copy; 2025&ndash;2026 Jennifer Qi</p>
        </footer>
    </div>
